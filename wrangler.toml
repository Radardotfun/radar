name = "narrative-radar"
main = "server/worker.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[ai]
binding = "AI"

# Web app (mobile) and the extension download, built by scripts/build-web.mjs.
[assets]
directory = "./dist/web"

# Holder-only data (server/holder.js): the coin and how much of it counts. Off until the Frontrun key is set.
[vars]
RADAR_MINT = "HyDSdtgiSa5mHqkTVoz8cTFTeVLFKdZ8amPvtNYfpump"
HOLDER_MIN_USD = "1"

# Radar's own record of which X accounts posted which coins (server/ledger.js, server/ledger.sql).
[[d1_databases]]
binding = "DB"
database_name = "radar-ledger"
database_id = "3dcfd367-581e-4f54-9e9d-3f1219d8b37c"
