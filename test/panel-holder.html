<!doctype html>
<!-- Manual check of "Who posted this" in the real panel. The live backend reads the post; holderStatus and holderWho are
     answered by a fake, so no wallet, no key and no Frontrun credits are involved. Serve the repo root and open
     /test/panel-holder.html. ?in shows a holder's view, ?none an account with no coins on record, ?off the feature off. -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel: holder check</title>
<style>html,body{margin:0;height:100%;background:#000}#root{width:400px;height:100vh;margin:0 auto}</style></head>
<body><div id="root"></div>
<script type="module">
import { makeHandlers, DEFAULTS } from '../extension/src/lib/handlers.js';
import { useBackend, mountInline } from '../extension/src/ui/radar.js';

const q = new URLSearchParams(location.search);
const mem = new Map();
const h = makeHandlers({
  settings: async () => DEFAULTS,
  store: { get: async (k) => mem.get(k) ?? null, set: async (k, v) => { mem.set(k, v); } },
  openWindow: (url) => window.open(url),
  rpcUrl: async () => null,
  ready: Promise.resolve(),
});
h.holderStatus = async () => (q.has('off') ? { on: false } : { on: true, pitch: 'Hold $1 of $RADAR to see the coins this account has posted before, and which of those posts are gone.', holder: q.has('in') || q.has('none'), exp: Date.now() + 3600_000 });
h.holderWho = async () => ({
  handle: 'test',
  own: q.has('none') ? { coins: { live: 0, deleted: 0, deletedPosts: 0 }, recent: [] } : { coins: { live: 4, deleted: 2, deletedPosts: 2 }, recent: [
    { ca: 'DezXAZ8z7PnrnRJjz3wXBoRgixCa6xjnB7YaB1pPB263', id: '100001', at: Date.now() - 3 * 864e5, gone: false, symbol: 'BONK', mc: 1250000000 },
    { ca: 'So11111111111111111111111111111111111111112', id: '100002', at: Date.now() - 9 * 864e5, gone: true, symbol: 'RUGGED', mc: 2100 },
    { ca: '0x7fe995a80075df3dc8ae11a9b82c7fe4202cd87f', id: '100003', at: Date.now() - 20 * 864e5, gone: true },
  ] },
});
useBackend(h, { css: '../extension/src/ui/radar.css' });
const radar = await mountInline(document.getElementById('root'), 'dark');
window.radar = radar;
radar.scan({ post: { text: 'the og solana dog is still here $BONK', author: 'test', url: 'https://x.com/test/status/1' }, source: { kind: '@test', label: 'Holder check' } });
</script></body></html>
