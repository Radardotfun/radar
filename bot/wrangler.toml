# The Radar bot: a separate Worker, so its keys, schedule and limits stay apart from the Radar server.
# Deploy from this folder: npx wrangler deploy
name = "radar-bot"
main = "worker.js"
compatibility_date = "2026-09-01"

# DexScreener answers some Cloudflare regions 429 (error 1015) for minutes at a time, which ended tags in "too busy".
# Tested 30 Oct 2026: London and Virginia blocked, Mumbai answering.
[placement]
region = "gcp:asia-south1"

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "BOT_KV"
id = "49b7576e1bd54ae2b7148d2a75d522cb"

# Discord, Telegram and the narrative wire (bot/chat.js).
[[d1_databases]]
binding = "DB"
database_name = "radar-ledger"
database_id = "3dcfd367-581e-4f54-9e9d-3f1219d8b37c"

# Requests to the Radar server (narrative-radar) go through this binding instead of the public internet.
[[services]]
binding = "RADAR"
service = "narrative-radar"

# This Worker itself: each tag is handled in its own run, so a busy minute never hits the per-run request limit.
[[services]]
binding = "SELF"
service = "radar-bot"

[vars]
BOT_LIVE = "1"
