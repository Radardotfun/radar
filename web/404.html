<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Page not found · Radar</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#07050f" />
  <link rel="icon" href="/icons/icon32.png" sizes="32x32" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <script>
    // Swap x.com for this site in a post link and it opens a scan of that post. _redirects can't put a placeholder in a query string.
    (function () { var m = location.pathname.match(/^\/(\w{1,15}|i\/web)\/status\/(\d{1,25})/); if (m) location.replace('/scan?url=' + encodeURIComponent('https://x.com/' + m[1] + '/status/' + m[2])); })();
  </script>
  <link rel="stylesheet" href="/trade.css?v=1.7.106" />
</head>
<body>
  <header class="nav">
    <a class="brand" href="/" aria-label="Radar home"><img src="/icons/icon32.png" width="28" height="28" alt="" /><span>Radar</span></a>
    <a class="back" href="/scan">Scan a post</a>
  </header>
  <main class="trade-page">
    <p class="eyebrow">404</p>
    <h1>Page not found</h1>
    <p class="lede">This page doesn't exist or has moved. Paste a post into the scanner to find the coins behind it.</p>
    <p><a class="button primary" href="/scan">Scan a post</a></p>
  </main>
</body>
</html>
